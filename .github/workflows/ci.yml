name: CI

# 代码 CI：推送与 PR 都跑一遍语法检查 + 单测。
# 之前这个仓库只有「提交数据」的 workflow，代码坏了没人拦。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run verify
      run: ./scripts/verify.sh

  # 站点单独一个 job：Node 工具链与 Python 无关，失败信息也更清楚
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - name: Install site dependencies
      run: npm ci

    - name: Verify site
      run: bash scripts/verify-site.sh
